# Lavalink v4 configuration for earworm.
#
# Key facts about Lavalink v4:
#   - YouTube is NOT enabled out of the box. We pull it via the youtube-source
#     plugin (lavalink-devs/youtube-source on GitHub) and DISABLE Lavalink's
#     legacy built-in YouTube source (lavaplayer's, which Google broke).
#   - SoundCloud, Bandcamp, Twitch, Vimeo, and HTTP (for arbitrary audio URLs,
#     including Discord message attachments) are built-in.
#   - The "http" source is what lets us load Discord attachment audio
#     files directly without any extra glue.

server:
  port: ${SERVER_PORT:2333}
  address: ${SERVER_ADDRESS:0.0.0.0}

plugins:
  youtube:
    enabled: true
    # August 2026 client mix. TV is first because it is the only client that
    # sends the OAuth token (required to get past YouTube's login wall).
    # IOS / ANDROID_VR remain anonymous fallbacks; MUSIC is search-only
    # (ytmsearch: / YouTube Music links). WEB / WEBEMBEDDED currently return
    # UNPLAYABLE and are omitted. Revisit when youtube-source cuts a
    # post-1.18.2 release or SABR/poToken support lands.
    clients: ["TV", "IOS", "ANDROID_VR", "MUSIC", "TVHTML5_SIMPLY"]
    # YouTube device-code OAuth. Use a burner Google account — never a
    # primary. After the first successful login, paste refreshToken below
    # so restarts skip the device-code flow. Do not commit a real token.
    oauth:
      enabled: true
      # refreshToken: "paste the token from Lavalink logs here"

lavalink:
  plugins:
    # youtube-source plugin replaces the legacy YouTube path. Plugin versions
    # break when YouTube ships new player JS — keep this on a recent release
    # and bump when you see "Must find sig function from script" errors.
    #
    # 1.18.2 (latest tagged release, Jul 27) does not include the August
    # Innertube client fixes. Pin the current main snapshot until 1.18.3
    # (or equivalent) is published, then switch back to a tagged release
    # and snapshot: false.
    # Snapshot f45bbb7: IOS playable, iOS client 21.02.35, TV PS4 UA,
    # contentLength recovery for SABR-fallback formats.
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      snapshot: true
  server:
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      youtube: false           # disable the legacy lavaplayer YouTube source
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true               # needed for Discord attachment URLs
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: false
      timescale: false
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

logging:
  level:
    root: INFO
    lavalink: INFO
    # Device-code URL + refresh token are logged here on first OAuth login.
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  request:
    enabled: true
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
